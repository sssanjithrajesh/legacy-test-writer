[project]
name = "legacy-test-writer"
version = "0.1.0"
description = "Generates characterization tests for a legacy Java module, measures coverage and mutation score before and after, and routes suspicious tests to a human."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
llm = [
    "anthropic>=0.34",
]

[project.scripts]
ltw = "ltw.cli:main"
ltw-eval = "evals.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltw", "evals"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["java: needs a JDK and Maven on the machine"]
